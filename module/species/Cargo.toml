[package]
name = "sango-species"
version.workspace = true
edition.workspace = true
description = "The species editor of Sango Studio."

[dependencies]
sango-core.workspace = true
sango-species-base.workspace = true
sango-pack.workspace = true
sango-modelport.workspace = true
sango-cry.workspace = true
sango-music.workspace = true
rodio = { version = "0.20", default-features = false }
rfd.workspace = true
sango-ui.workspace = true
zerocopy.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
