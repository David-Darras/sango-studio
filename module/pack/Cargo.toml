[package]
name = "sango-pack"
version.workspace = true
edition.workspace = true
description = "Species packs: the format, the registry of numbers and the files that the plugin reads."

[dependencies]
sango-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
