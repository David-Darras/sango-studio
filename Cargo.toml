[workspace]
resolver = "2"
members = ["app", "module/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
rfd = "0.15"
zerocopy = { version = "0.8", features = ["derive"] }

sango-core = { path = "module/core" }
sango-ui = { path = "module/ui" }
sango-home = { path = "module/home" }
sango-archive = { path = "module/archive" }
sango-species = { path = "module/species" }
sango-leveling-rate = { path = "module/leveling_rate" }
sango-item = { path = "module/item" }
sango-move = { path = "module/move" }
sango-ability = { path = "module/ability" }
sango-rules = { path = "module/rules" }
sango-type = { path = "module/type" }
sango-code = { path = "module/code" }
sango-pack = { path = "module/pack" }

[profile.dev]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
