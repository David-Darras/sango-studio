[workspace]
resolver = "2"
members = ["app", "module/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
rfd = "0.15"
zerocopy = { version = "0.8", features = ["derive"] }

sango-core = { path = "module/core" }
sango-ui = { path = "module/ui" }
sango-home = { path = "module/home" }
sango-archive = { path = "module/archive" }
sango-species = { path = "module/species" }
sango-species-base = { path = "module/species_base" }
sango-leveling-rate = { path = "module/leveling_rate" }
sango-item = { path = "module/item" }
sango-move = { path = "module/move" }
sango-ability = { path = "module/ability" }
sango-rules = { path = "module/rules" }
sango-type = { path = "module/type" }
sango-pack = { path = "module/pack" }
sango-packs = { path = "module/packs" }
sango-modelport = { path = "module/modelport" }
sango-cry = { path = "module/cry" }
sango-music = { path = "module/music" }
sango-overworld = { path = "module/overworld" }
sango-trainer = { path = "module/trainer" }
sango-choreography = { path = "module/choreography" }
sango-effect = { path = "module/effect" }
sango-script = { path = "module/script" }
sango-encounter = { path = "module/encounter" }
sango-formula = { path = "module/formula" }
sango-character = { path = "module/character" }
sango-nature = { path = "module/nature" }
sango-font = { path = "module/font" }
sango-layout = { path = "module/layout" }
sango-battle = { path = "module/battle" }

# The code of the studio compiles fast with few optimizations. The libraries (egui, wgpu, image, the decoders) change
# rarely: they are optimized fully once, so the 3D views and the decoding stay fast. The debug information keeps only
# the lines, which is enough for the backtrace of crash.log and makes the target folder much smaller.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
